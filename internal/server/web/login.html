<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShellGate — Sign in</title>
  <style>
    :root { --bg: #171819; --fg: #e8e7e3; --muted: #a09f99; --line: #404140; --accent: #d4c9af; --danger: #f0817a; --radius: 4px; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { min-height: 100%; margin: 0; }
    body { min-height: 100svh; display: grid; place-items: center; padding: 32px; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    main { width: min(800px, 100%); display: grid; grid-template-columns: 1fr 280px; column-gap: 64px; align-items: center; padding: 48px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .identity { min-width: 0; }
    .authentication { min-width: 0; }
    .signin-title { margin: 0 0 12px; font-size: 22px; font-weight: 500; line-height: 1.3; letter-spacing: -.02em; }
    .primary { border-color: var(--accent); background: var(--accent); color: var(--bg); justify-content: center; font-weight: 600; }
    .primary:hover:not(:disabled) { background: #e4dac5; }
    .primary:active:not(:disabled) { background: #bdb196; }
    #provider { margin-top: 12px; overflow-wrap: anywhere; }
    #accessNote { line-height: 1.6; }
    .authentication.sso #accessNote { margin: 0 0 24px; }
    .brand { margin: 0; font: 400 clamp(32px, 5vw, 48px)/1.2 ui-monospace, Menlo, monospace; letter-spacing: -0.065em; }
    .sub { margin: 16px 0 0; color: var(--muted); font-size: 14px; }
    button { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; width: 100%; padding: 12px 16px; border: 1px solid var(--accent); border-radius: var(--radius); background: transparent; color: var(--fg); font: inherit; font-size: 14px; cursor: pointer; }
    button:hover:not(:disabled) { background: #292a29; }
    button:active:not(:disabled) { background: #343532; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    button:disabled { opacity: .5; cursor: wait; }
    button svg { width: 18px; height: 18px; }
    .meta { margin-top: 16px; color: var(--muted); font-size: 12px; }
    input { display:block; width:100%; margin:6px 0 16px; padding:12px; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg); color:var(--fg); font:inherit; }
    details { margin-top:20px; font-size:13px; }
    details summary { cursor:pointer; color:var(--muted); }
    form { margin-top:20px; }
 #passwordLogin { margin:0 0 16px; }

 .secondary { border-color:var(--line); font-size:13px; margin-top:12px; }
    label { display:block; }
    #msg { margin-top: 12px; font-size: 13px; line-height: 1.6; color: var(--danger); overflow-wrap: anywhere; }
    #msg:empty { margin: 0; }
    #totpError { color:var(--danger); font-size:13px; line-height:1.6; overflow-wrap:anywhere; }
    #totpLogin { margin-top:24px; }
    .back-link { display:inline-block; color:var(--muted); margin-top:24px; font-size:13px; }
    .back-link:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    @media (max-width: 640px) { main { grid-template-columns: 1fr; gap: 0; padding: 32px 0; width: min(360px, 100%); } .identity { margin-bottom: 40px; } body { padding: 24px; } }
  </style>
</head>
<body>
  <main>
    <div class="identity"><h1 class="brand">shell-gate</h1>
    <p class="sub">Your terminal workspace</p></div>
    <section class="authentication" id="primaryAuth" aria-label="Sign in">
    <h2 id="signinTitle" class="signin-title" hidden>Sign in</h2>
    <p id="loading" class="meta" role="status">Loading sign-in options…</p>
    <div id="accessNote" class="meta" hidden>Access is limited to invited accounts.</div>
    <form id="passwordLogin" hidden>
      <label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username" required />
      <label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
    </form>
    <button id="btn" class="secondary" type="button" hidden disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="10" rx="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        <circle cx="12" cy="16" r="1.4" fill="currentColor" stroke="none" />
      </svg>
      Sign in with a passkey
    </button>
    <button id="btnSSO" class="secondary" type="button" hidden disabled>Sign in with SSO</button>
    <p id="provider" class="meta" hidden></p>
    <details id="enroll" hidden><summary>Set up or recover an account</summary>
      <form id="register">
        <h2 style="font-size:16px;font-weight:400;margin:0 0 20px">Set up or recover an account</h2>
        <label for="email">Email</label><input id="email" type="email" autocomplete="email" required />
        <label for="invitation">Invitation code</label><input id="invitation" type="password" autocomplete="off" required />
        <label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="12 or more characters" required />
        <button type="submit">Set password and sign in</button>
        <button id="registerPasskey" class="secondary" type="button">Use a passkey instead · no password needed</button>
      </form>
    </details>
    <div id="msg" role="status" aria-live="polite" aria-atomic="true"></div>
    <button id="retry" class="secondary" type="button" hidden>Retry</button>
    <noscript>Enable JavaScript to sign in to ShellGate.</noscript>
    </section>
    <section class="authentication" id="totpAuth" aria-labelledby="totpTitle" hidden>
      <h2 class="signin-title" id="totpTitle">Two-factor authentication</h2>
      <form id="totpLogin">
        <label for="totpCode" id="totpLabel">Authenticator code</label>
        <input id="totpCode" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,8}" maxlength="8" required />
        <button class="primary" type="submit" id="verifyTOTP">Verify</button>
      </form>
      <p id="totpError" role="status" aria-live="polite" aria-atomic="true"></p>
      <button class="secondary" id="useRecovery" type="button">Use a recovery code</button>
      <a class="back-link" href="/logout">Back to sign in</a>
    </section>
  </main>
  <script type="module">
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");
    const form = document.getElementById("register");
    const show = (text) => { msg.textContent = text || ""; };
    const primaryAuth = document.getElementById("primaryAuth");
    const totpAuth = document.getElementById("totpAuth");
    const totpError = document.getElementById("totpError");
    const totpInput = document.getElementById("totpCode");
    const totpVerify = document.getElementById("verifyTOTP");
    let recoveryMode = false;
    function showSecondFactor() {
      primaryAuth.hidden = true;
      totpAuth.hidden = false;
      history.replaceState(null, "", "/login?step=totp");
    }
    function finishSignIn(result) {
      if (result.mfaRequired) showSecondFactor();
      else location.replace("/");
    }
    document.getElementById("useRecovery").addEventListener("click", () => {
      recoveryMode = !recoveryMode;
      totpInput.value = "";
      totpError.textContent = "";
      totpInput.inputMode = recoveryMode ? "text" : "numeric";
      totpInput.maxLength = recoveryMode ? 64 : 8;
      if (recoveryMode) totpInput.removeAttribute("pattern");
      else totpInput.setAttribute("pattern", "[0-9 ]{6,8}");
      document.getElementById("totpLabel").textContent = recoveryMode ? "Recovery code" : "Authenticator code";
      document.getElementById("useRecovery").textContent = recoveryMode ? "Use an authenticator code" : "Use a recovery code";
      totpInput.focus();
    });
    document.getElementById("totpLogin").addEventListener("submit", async (event) => {
      event.preventDefault();
      totpVerify.disabled = true;
      totpVerify.textContent = "Verifying…";
      totpError.textContent = "";
      try {
        await post("/api/totp/verify", {code:totpInput.value});
        totpInput.value = "";
        location.replace("/");
      } catch (error) { totpError.textContent = error.message || "Verification failed. Please try again."; }
      finally { totpVerify.disabled = false; totpVerify.textContent = "Verify"; }
    });
    const decode = (value) => Uint8Array.from(atob(value.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
    const encode = (value) => btoa(String.fromCharCode(...new Uint8Array(value))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    async function post(path, body = {}) {
      const res = await fetch(path, { method: "POST", credentials: "same-origin", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
      const value = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(value.message || "Request failed. Please try again.");
      return value;
    }
    function serialize(credential) {
      const response = { clientDataJSON: encode(credential.response.clientDataJSON) };
      for (const key of ["attestationObject", "authenticatorData", "signature", "userHandle"]) {
        if (credential.response[key]) response[key] = encode(credential.response[key]);
      }
      if (credential.response.getTransports) response.transports = credential.response.getTransports();
      return { id: credential.id, rawId: encode(credential.rawId), type: credential.type, response, clientExtensionResults: credential.getClientExtensionResults() };
    }
    function prepare(options) {
      const p = options.publicKey;
      p.challenge = decode(p.challenge);
      if (p.user) p.user.id = decode(p.user.id);
      for (const key of ["allowCredentials", "excludeCredentials"]) {
        if (p[key]) p[key] = p[key].map((c) => ({ ...c, id: decode(c.id) }));
      }
      return options;
    }
    async function busy(action) {
      show(""); btn.disabled = true;
      for (const el of document.querySelectorAll("button")) el.disabled = true;
      try { await action(); }
      catch (e) { show(e.name === "NotAllowedError" ? "The passkey request was cancelled or timed out. Try again when ready." : e.message || "Sign-in failed."); }
      finally { btn.disabled = false; for (const el of document.querySelectorAll("button")) el.disabled = false; }
    }
    const loading = document.getElementById("loading");
    const retry = document.getElementById("retry");
    const note = document.getElementById("accessNote");
    const loginError = new URLSearchParams(location.search).get("error");
    if (loginError) history.replaceState(null, "", location.pathname);
    const boundSSOButtons = new WeakSet();
    function configureSSO(button) {
      button.hidden = false;
      if (boundSSOButtons.has(button)) return;
      boundSSOButtons.add(button);
      const reset = () => {
        button.disabled = false;
        button.textContent = "Sign in with SSO";
        button.removeAttribute("aria-busy");
      };
      window.addEventListener("pageshow", reset);
      button.addEventListener("click", () => {
        show("");
        button.disabled = true;
        button.textContent = "Connecting…";
        button.setAttribute("aria-busy", "true");
        location.assign("/api/sso/login");
      });
    }
    async function main() {
      retry.hidden = true;
      loading.hidden = false;
      show("");
      const res = await fetch("/api/config", {credentials:"same-origin", signal: AbortSignal.timeout(10000)});
      if (!res.ok) throw new Error("Could not load sign-in settings. Please reload.");
      const cfg = await res.json();
      const pendingResponse = await fetch("/api/totp/pending", {credentials:"same-origin", signal:AbortSignal.timeout(10000)});
      if (!pendingResponse.ok) throw new Error("Could not check sign-in status.");
      const pending = await pendingResponse.json();
      if (pending.required) { loading.hidden = true; showSecondFactor(); return; }
      if (new URLSearchParams(location.search).get("step") === "totp") {
        show("The verification request expired. Sign in again.");
        history.replaceState(null, "", "/login");
      }
      loading.hidden = true;
      note.hidden = false;
      if (loginError) {
        const messages = {
          not_allowed: "This account is not allowed. Ask the operator to add your email to the allowlist.",
          unverified_email: "Your organization has not confirmed your email address. Contact your administrator.",
          expired: "The sign-in request expired. Please try again.",
          access_denied: "Sign-in was cancelled at the identity provider.",
          provider_unavailable: "Could not connect to your sign-in provider. Please try again.",
          login_failed: "Sign-in failed. Please try again.",
        };
        show(messages[loginError] || "Sign-in failed. Please try again.");
      }
      if (cfg.ssoEnabled && cfg.authMode !== "sso" && cfg.authMode !== "oidc") {
        configureSSO(document.getElementById("btnSSO"));
        document.getElementById("btnSSO").disabled = false;
      }
      if (cfg.authMode === "sso" || cfg.authMode === "oidc") {
        document.querySelector(".authentication").classList.add("sso");
        document.getElementById("signinTitle").hidden = false;
        note.textContent = "Use your organization account.";
        btn.textContent = "Sign in with SSO";
        btn.className = "primary";
        btn.hidden = false;
        if (cfg.ssoIssuer) {
          const provider = document.getElementById("provider");
          provider.textContent = new URL(cfg.ssoIssuer).hostname;
          provider.hidden = false;
        }
        configureSSO(btn);
      } else if (cfg.authMode === "local") {
        document.getElementById("passwordLogin").hidden = false;
        document.getElementById("passwordLogin").addEventListener("submit", (e) => { e.preventDefault(); busy(async () => {
          const result = await post("/api/password/login", {email:document.getElementById("loginEmail").value,password:document.getElementById("loginPassword").value});
          document.getElementById("loginPassword").value = "";
          finishSignIn(result);
        }); });
        form.addEventListener("submit", (e) => { e.preventDefault(); busy(async () => {
          const result = await post("/api/password/register", {email:document.getElementById("email").value,token:document.getElementById("invitation").value,password:document.getElementById("newPassword").value});
          document.getElementById("newPassword").value = "";
          document.getElementById("invitation").value = "";
          finishSignIn(result);
        }); });
        const passkeySupported=window.isSecureContext && !!window.PublicKeyCredential;
        btn.hidden=!passkeySupported;
        document.getElementById("registerPasskey").hidden=!passkeySupported;
        document.getElementById("enroll").hidden = false;
        document.getElementById("enroll").addEventListener("toggle", (e) => {
          const open = e.currentTarget.open;
          document.getElementById("passwordLogin").hidden = open;
          btn.hidden = open || !passkeySupported;
          document.getElementById("accessNote").hidden = open;
          e.currentTarget.querySelector("summary").textContent = open ? "Back to sign in" : "Set up or recover an account";
        });
        btn.addEventListener("click", () => busy(async () => {
          const options = prepare(await post("/api/passkeys/login/begin"));
          const credential = await navigator.credentials.get(options);
          finishSignIn(await post("/api/passkeys/login/finish", serialize(credential)));
        }));
        document.getElementById("registerPasskey").addEventListener("click", () => { if(!document.getElementById("email").reportValidity() || !document.getElementById("invitation").reportValidity()) return; busy(async () => {
          const options = prepare(await post("/api/passkeys/register/begin", {email:document.getElementById("email").value, token:document.getElementById("invitation").value}));
          const credential = await navigator.credentials.create(options);
          const result = await post("/api/passkeys/register/finish", serialize(credential));
          document.getElementById("invitation").value = "";
          finishSignIn(result);
        }); });
      } else if (cfg.authMode === "supabase") {
        const { createClient } = await import("/__shellgate/external-auth.js");
        const supabase = createClient(cfg.supabaseUrl, cfg.anonKey, {auth:{experimental:{passkey:true},persistSession:false,autoRefreshToken:false}});
        btn.hidden = false;
        btn.addEventListener("click", () => busy(async () => {
          const {data,error} = await supabase.auth.signInWithPasskey();
          if (error) throw error;
          if (!data?.session?.access_token) throw new Error("The provider did not return a session.");
          finishSignIn(await post("/api/session", {access_token:data.session.access_token}));
        }));
      } else {
        throw new Error("Sign-in is not configured. Contact your administrator.");
      }
      btn.disabled = false;
    }
    function initialize() {
      main().catch(() => {
        loading.hidden = true;
        show("Could not load sign-in options. Check your connection and retry.");
        retry.hidden = false;
        btn.disabled = true;
      });
    }
    retry.addEventListener("click", initialize);
    initialize();
  </script>
</body>
</html>
